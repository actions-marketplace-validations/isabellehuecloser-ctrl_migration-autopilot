<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#1a2230" stroke-width="1" opacity="0.5">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- logo + brand -->
  <g transform="translate(80, 76)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#blueAccent)"/>
    <rect x="13" y="15" width="26" height="6" rx="3" fill="#0d1117"/>
    <rect x="13" y="25" width="26" height="6" rx="3" fill="#0d1117" opacity="0.85"/>
    <rect x="13" y="35" width="18" height="6" rx="3" fill="#0d1117" opacity="0.7"/>
    <text x="70" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Migration Autopilot</text>
  </g>

  <!-- headline -->
  <text x="80" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">Catch the migration that</text>
  <text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#blueAccent)" letter-spacing="-1.5">locks your production table.</text>

  <!-- subhead -->
  <text x="80" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#8b949e">Reviews every DB-migration PR. Blocks the unsafe ones before they ship.</text>

  <!-- risk chips -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="210" height="48" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="6" fill="#f85149"/>
    <text x="46" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e6edf3">data loss</text>

    <rect x="230" y="0" width="200" height="48" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="258" cy="24" r="6" fill="#d29922"/>
    <text x="276" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e6edf3">prod lock</text>

    <rect x="450" y="0" width="240" height="48" rx="10" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
    <circle cx="478" cy="24" r="6" fill="#2f81f7"/>
    <text x="496" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e6edf3">silent break</text>
  </g>

  <!-- ORM row -->
  <text x="80" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#8b949e">Prisma  ·  Drizzle  ·  Rails  ·  raw SQL</text>

  <!-- footer URL -->
  <text x="1120" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="end">migration.useautopilot.dev</text>
</svg>
