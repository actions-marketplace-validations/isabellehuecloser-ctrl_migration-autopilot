server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Healthcheck endpoint Fly expects on /healthz.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location = /og.png {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Calendar file: served as text/calendar so Google Calendar accepts the import.
  location = /launch.ics {
    types { } default_type "text/calendar; charset=utf-8";
    add_header Content-Disposition "attachment; filename=migration-autopilot-launch.ics";
  }
  location = /weekly.ics {
    types { } default_type "text/calendar; charset=utf-8";
    add_header Content-Disposition "attachment; filename=autopilot-weekly-content.ics";
  }

  # Branded short links to drive consistent attribution.
  location = /install {
    return 302 https://github.com/marketplace/actions/migration-autopilot;
  }
  location = /demo {
    return 302 https://www.loom.com/share/ab8d293bd8b94baa89fb6ab090a2c974;
  }
  location = /repo {
    return 302 https://github.com/isabellehuecloser-ctrl/migration-autopilot;
  }

  # Serve real files; unknown paths get a real 404 page (not the home page).
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
