server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Healthcheck endpoint Fly expects on /healthz.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location = /og.png {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Short cache so smoke-test copy edits propagate fast.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=300";
  }
}
