name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The prompt/rule corpus IS the product — gate every change on the golden-set eval.
      # Fails if F1 drops below threshold or ANY false positive appears.
      - run: npm run evals
      - run: npm run build
      # Fail if dist/ is stale (the committed bundle must match source).
      - name: Verify dist is up to date
        run: git diff --exit-code -- dist || (echo "dist/ is out of date — run 'npm run build' and commit." && exit 1)
